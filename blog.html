<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supabase Blogs</title>

  <!-- Supabase JS CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    .blog {
      background: #fff;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .blog img {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>My Blogs</h1>
  <div id="blogs">Loading...</div>

  <script>
    // 🔑 SUPABASE KEYS (YAHAN APNI KEYS DALO)
    const SUPABASE_URL = "https://wusuxccycluxrnudgwzh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1c3V4Y2N5Y2x1eHJudWRnd3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NDgzNTksImV4cCI6MjA4NTQyNDM1OX0.Eao59gp6TXpNIHjipBF8yCbhzB-OPuWwvog0NBjrZ8M";

    // 🔗 Supabase Client
    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // 📥 Blogs Fetch Function
    async function loadBlogs() {
      const { data, error } = await supabase
        .from('sameer-blogs')
        .select('*')
        .order('published_date', { ascending: false });

      if (error) {
        document.getElementById("blogs").innerHTML = "Error loading blogs";
        console.error(error);
        return;
      }

      renderBlogs(data);
    }

    // 🖥️ Render Blogs
    function renderBlogs(blogs) {
      const container = document.getElementById("blogs");
      container.innerHTML = "";

      if (blogs.length === 0) {
        container.innerHTML = "No blogs found";
        return;
      }

      blogs.forEach(blog => {
        container.innerHTML += `
          <div class="blog">
            <h2>${blog.title}</h2>
            <p><strong>Author:</strong> ${blog.author || "Admin"}</p>
            <p>${blog.meta_description || ""}</p>
            ${blog.cover_image ? `<img src="${blog.cover_image}">` : ""}
            <p><small>${blog.published_date || ""}</small></p>
          </div>
        `;
      });
    }

    // 🚀 Call
    loadBlogs();
  </script>

</body>
</html>
