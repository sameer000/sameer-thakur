<!DOCTYPE html>
<html>
<!-- SEO Title -->
<title>My Website Title | Best Services in India</title>
<!-- SEO Meta Description -->
<meta name="description" content="This is a SEO friendly HTML page. We provide best web development and digital services in India.">
<!-- SEO Keywords (optional but ok) -->
<meta name="keywords" content="web development, SEO, HTML website, digital services">
<!-- Author -->
<meta name="author" content="Sameer">
<!-- Canonical URL -->
<link rel="canonical" href="https://yourwebsite.com/">
<!-- Favicon -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<!-- Open Graph (Facebook / WhatsApp) -->
<meta property="og:title" content="My Website Title">
<meta property="og:description" content="SEO friendly HTML website with fast loading and clean structure.">
<meta property="og:url" content="https://yourwebsite.com/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://yourwebsite.com/og-image.jpg">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My Website Title">
<meta name="twitter:description" content="SEO optimized HTML page for better Google ranking.">
<meta name="twitter:image" content="https://yourwebsite.com/og-image.jpg">

<head>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<canvas id="fluid" class="fluid"></canvas>
<div id="header"></div>
<main>
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
<!-- Hidden field for spam protection -->
<input type="hidden" name="form-name" value="contact" />

<!-- Honeypot field (spam ke liye) -->
<p style="display: none;">
<label>Don't fill this out: <input name="bot-field" /></label>
</p>

<!-- Aapke actual form fields -->
<div>
<label for="name">Name:</label>
<input type="text" id="name" name="name" required />
</div>

<div>
<label for="email">Email:</label>
<input type="email" id="email" name="email" required />
</div>

<div>
<label for="message">Message:</label>
<textarea id="message" name="message" required></textarea>
</div>

<button type="submit">Submit</button>
</form>

<h1>Projects</h1>
<section id="projects-section" class="projects-section">
<!-- Projects will be injected here -->
</section>
<main>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="/js/script.js"></script>
<script src="/js/canvas.js"></script>
<script type="module" src="/js/database.js"></script>
<div id="footer"></div>
</body>
</html>
