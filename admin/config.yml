# Netlify CMS configuration
backend:
  name: identity
  identity_url: https://sameer-thakur.site/.netlify/identity
  # branch is ignored for identity backend

media_folder: "static/images/uploads"  # Where uploaded images will go
public_folder: "/images/uploads"       # URL path for images

locale: "en"

collections:
  # ========================
  # Blog Collection
  # ========================
  - name: "blog"               # internal name
    label: "Blog"              # visible label in CMS
    folder: "content/blog"     # where markdown files are stored
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "/blog/{{slug}}"  # optional, if your frontend uses this
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Featured Image", name: "thumbnail", widget: "image" }
      - { label: "Categories", name: "categories", widget: "list" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ========================
  # Project Collection
  # ========================
  - name: "project"
    label: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    preview_path: "/projects/{{slug}}"   # optional
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Client Name", name: "client", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Project Image", name: "image", widget: "image" }
      - { label: "Short Description", name: "short_desc", widget: "text" }
      - { label: "Detailed Description", name: "body", widget: "markdown" }
      - { label: "Categories/Tags", name: "categories", widget: "list" }
