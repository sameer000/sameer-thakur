<!DOCTYPE html>
<html>
<head>
  <title>My First Blog</title>
</head>
<body>
  <div id="blog-content"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient('https://wusuxccycluxrnudgwzh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1c3V4Y2N5Y2x1eHJudWRnd3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NDgzNTksImV4cCI6MjA4NTQyNDM1OX0.Eao59gp6TXpNIHjipBF8yCbhzB-OPuWwvog0NBjrZ8M');
    const slug = 'my-first-blog'; // ye slug ke hisaab se change hoga

    const { data: blog } = await supabase
      .from('sameer-blogs')
      .select('*')
      .eq('slug', slug)
      .single();

    const container = document.getElementById('blog-content');

    if(blog){
      container.innerHTML = `
        <h1>${blog.title}</h1>
        <p>${blog.content}</p>
      `;
    } else {
      container.innerHTML = '<p>Blog not found</p>';
    }
  </script>
</body>
</html>
