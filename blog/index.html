<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog List</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <h1>All Blogs</h1>
  <div id="blog-list"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://wusuxccycluxrnudgwzh.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1c3V4Y2N5Y2x1eHJudWRnd3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NDgzNTksImV4cCI6MjA4NTQyNDM1OX0.Eao59gp6TXpNIHjipBF8yCbhzB-OPuWwvog0NBjrZ8M'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const blogList = document.getElementById('blog-list')

    async function fetchBlogs() {
      let { data: blogs, error } = await supabase
        .from('sameer-blogs')
        .select('*')
        .order('published_date', { ascending: false })

      if (error) {
        blogList.innerHTML = 'Error fetching blogs'
        console.error(error)
        return
      }

      blogs.forEach(blog => {
        const blogItem = document.createElement('div')
        blogItem.className = 'blog-item'
        blogItem.innerHTML = `
          <h2><a href="./${blog.slug}.html">${blog.title}</a></h2>
          <p>${blog.meta_description || ''}</p>
          <p>By ${blog.author || 'Unknown'} | ${blog.published_date}</p>
        `
        blogList.appendChild(blogItem)
      })
    }

    fetchBlogs()
  </script>
</body>
</html>
