<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Detail | Sameer</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"></script>
</head>
<body>
  <div id="blog-content">Loading...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://wusuxccycluxrnudgwzh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1c3V4Y2N5Y2x1eHJudWRnd3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NDgzNTksImV4cCI6MjA4NTQyNDM1OX0.Eao59gp6TXpNIHjipBF8yCbhzB-OPuWwvog0NBjrZ8M'
    );

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');
    const container = document.getElementById('blog-content');

    if (!slug) {
      container.innerHTML = "<p>No blog selected</p>";
    } else {
      const { data: blog, error } = await supabase
        .from('sameer-blogs')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error) {
        container.innerHTML = "<p>Error loading blog</p>";
        console.error(error);
      } else if (!blog) {
        container.innerHTML = "<p>Blog not found</p>";
      } else {
        container.innerHTML = `
          <h1>${blog.title}</h1>
          <p><strong>Author:</strong> ${blog.author || 'Admin'}</p>
          ${blog.cover_image ? `<img src="${blog.cover_image}" alt="${blog.title}">` : ''}
          <p><small>${blog.published_date || ''}</small></p>
          <div>${blog.content}</div>
        `;
      }
    }
  </script>
</body>
</html>
