<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Detail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="blog-detail"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://wusuxccycluxrnudgwzh.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1c3V4Y2N5Y2x1eHJudWRnd3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NDgzNTksImV4cCI6MjA4NTQyNDM1OX0.Eao59gp6TXpNIHjipBF8yCbhzB-OPuWwvog0NBjrZ8M'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const blogDetail = document.getElementById('blog-detail')

    // URL se slug get karo
    const slug = window.location.pathname.split('/').pop().replace('.html','')

    async function fetchBlog() {
      let { data: blog, error } = await supabase
        .from('sameer-blogs')
        .select('*')
        .eq('slug', slug)
        .single()

      if (error || !blog) {
        blogDetail.innerHTML = 'Blog not found'
        return
      }

      blogDetail.innerHTML = `
        <h1>${blog.title}</h1>
        <p>By ${blog.author || 'Unknown'} | ${blog.published_date}</p>
        <img src="${blog.cover_image || ''}" alt="${blog.title}">
        <p>${blog.meta_description || ''}</p>
        <div>${blog.content || ''}</div>
      `
    }

    fetchBlog()
  </script>
</body>
</html>
